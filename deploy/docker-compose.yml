version: '3.8'
services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: chorequest-api:dev
    container_name: chorequest-api
    env_file:
      - ./api.env
    ports:
      - "8080:8080"
    environment:
      - SQLITE_PATH=/data/app.sqlite
    volumes:
      - api-data:/data
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: chorequest-web:dev
    container_name: chorequest-web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  api-data:
